[package]
name = "tt-playground"
version = "0.1.0"
edition = "2021"
description = "Template Toolkit playground: the Rust port compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
template-toolkit = { path = "..", features = ["js"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
