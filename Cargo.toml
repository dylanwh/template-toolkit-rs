[package]
name = "template-toolkit"
version = "3.0.9"
edition = "2021"
description = "Rust port of Perl's Template::Toolkit (TT2)"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"

[dependencies]
bon = "3"
regex = "1.10"
fancy-regex = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
jiff = "0.2.38"
pure-rust-locales = "0.8.2"
memchr = "2.8.3"
regex-automata = "0.4"
regex-syntax = "0.8"

[features]
# Browser support for wasm32-unknown-unknown: the wall clock (Date.now)
# and the local time zone come from the JavaScript host.
js = ["dep:js-sys", "jiff/js"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }

[workspace]
members = ["tpage-rs", "playground"]
default-members = [".", "tpage-rs"]

# Smaller, faster binaries (measured on tpage-rs: ~10% faster cold start and
# ~0.6 MiB less RSS than the defaults).  Profiles only apply to binaries built
# in this workspace, not to crates depending on template-toolkit.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# For the WebAssembly playground: size matters more than speed there.
[profile.wasm]
inherits = "release"
opt-level = "s"
