[package]
name = "template-toolkit"
version = "3.0.9"
edition = "2021"
description = "Rust port of Perl's Template::Toolkit (TT2)"

[dependencies]
bon = "3"
regex = "1.10"
fancy-regex = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
jiff = "0.2.38"
pure-rust-locales = "0.8.2"

[workspace]
members = ["tpage-rs"]
default-members = [".", "tpage-rs"]
